<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="mraga">
  <defs>
    <radialGradient id="mrg1-glow" cx="58%" cy="46%" r="58%">
      <stop offset="0%" stop-color="#ff9d3a" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#ff9d3a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="#0a0d16"/>
  <rect width="512" height="512" rx="104" fill="url(#mrg1-glow)"/>
  <!-- drone: the sustained tonic baseline -->
  <line x1="132" y1="372" x2="380" y2="372" stroke="#8a4d22" stroke-width="12" stroke-linecap="round"/>
  <!-- microtonal ticks on the drone (uneven spacing) -->
  <g stroke="#8a4d22" stroke-width="6" stroke-linecap="round">
    <line x1="172" y1="360" x2="172" y2="384"/>
    <line x1="210" y1="360" x2="210" y2="384"/>
    <line x1="336" y1="360" x2="336" y2="384"/>
  </g>
  <!-- struck string: plucked up from the drone to the resolving note -->
  <line x1="308" y1="372" x2="308" y2="262" stroke="#ffe0b0" stroke-width="8" stroke-linecap="round"/>
  <!-- conducted phrase rising to resolve on the note -->
  <g fill="#ffcf8a">
    <circle cx="150" cy="330" r="8"/>
    <circle cx="200" cy="300" r="10" fill="#ffd79a"/>
    <circle cx="252" cy="266" r="12" fill="#ffe0b0"/>
  </g>
  <!-- ringing arcs radiating from the struck resolved tonic -->
  <g fill="none" stroke="#ff9d3a" stroke-linecap="round">
    <path d="M308 202 a54 54 0 0 1 54 54" stroke-width="9" stroke-opacity="0.85"/>
    <path d="M308 176 a80 80 0 0 1 80 80" stroke-width="8" stroke-opacity="0.5"/>
    <path d="M308 150 a106 106 0 0 1 106 106" stroke-width="7" stroke-opacity="0.28"/>
  </g>
  <!-- resolved tonic node -->
  <circle cx="308" cy="256" r="24" fill="#ffb14d"/>
  <circle cx="308" cy="256" r="11" fill="#ff6a2c"/>
</svg>
